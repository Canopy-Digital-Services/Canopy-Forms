name: canopy-sites

services:
  portal:
    build:
      context: .
      dockerfile: apps/portal/Dockerfile.dev
    container_name: canopy-portal
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:3006:3000"
    networks:
      - canopy-sites-network
    # Repo root is mounted (workspaces); the portal runs from its own directory
    working_dir: /app/apps/portal
    volumes:
      # Mount source code for hot reloading
      - .:/app
      - node_modules:/app/node_modules
    environment:
      # NOTE: Do NOT set NODE_ENV here — next dev/build set it automatically.
      # Hardcoding "development" prevents next build from working in the dev container.
      # Database - update with your PostgreSQL credentials
      DATABASE_URL: "postgresql://user:password@postgres:5432/canopy-forms?schema=public"
      
      # NextAuth
      NEXTAUTH_SECRET: "KlIv302grODQdAt/eoJQaE/GtPeBSi7R/2xgYF03SO4="
      NEXTAUTH_URL: "http://localhost:3006"
      NEXT_PUBLIC_APP_URL: "http://localhost:3006"
      AUTH_TRUST_HOST: "true"
      
      # SMTP (Migadu or other)
      SMTP_HOST: "${SMTP_HOST}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER}"
      SMTP_PASS: "${SMTP_PASS}"
      SMTP_FROM: "${SMTP_FROM}"
      
      # Admin seed (optional, for initial setup)
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@canopyds.com}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-changeme123}"
    depends_on:
      - postgres

  postgres:
    image: postgres:17-alpine
    container_name: canopy-portal-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: canopy-forms
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - canopy-sites-network

volumes:
  node_modules:
  # Not "postgres_data": under this project name that would attach the
  # abandoned July 2026 canopy-sites volume, which holds an unrelated schema.
  pgdata:

networks:
  canopy-sites-network:
    driver: bridge
