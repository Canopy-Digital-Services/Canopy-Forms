name: canopy-sites

services:
  portal:
    build:
      context: .
      dockerfile: apps/portal/Dockerfile.dev
    container_name: canopy-portal
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:3006:3000"
    networks:
      - canopy-sites-network
    # Repo root is mounted (workspaces); the portal runs from its own directory
    working_dir: /app/apps/portal
    volumes:
      # Mount source code for hot reloading
      - .:/app
      - node_modules:/app/node_modules
    environment:
      # NOTE: Do NOT set NODE_ENV here — next dev/build set it automatically.
      # Hardcoding "development" prevents next build from working in the dev container.
      # Database - update with your PostgreSQL credentials
      DATABASE_URL: "postgresql://user:password@postgres:5432/canopy-forms?schema=public"
      
      # Public app URL (emailed links; https makes the session cookie Secure)
      NEXTAUTH_URL: "http://localhost:3006"
      NEXT_PUBLIC_APP_URL: "http://localhost:3006"
      SITES_URL: "http://sites.localhost:3006"
      
      # SMTP (Migadu or other)
      SMTP_HOST: "${SMTP_HOST}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER}"
      SMTP_PASS: "${SMTP_PASS}"
      SMTP_FROM: "${SMTP_FROM}"
      
      # Admin seed (optional, for initial setup)
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@canopyds.com}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-changeme123}"

      # Site builder (apps/builder). The token is a local-only value.
      BUILDER_URL: "http://builder:4100"
      BUILDER_TOKEN: "local-dev-builder-token-not-a-secret-000"
    depends_on:
      - postgres

  # The site builder, building from local bare repos under
  # ~/repos/.canopy-local-remotes (a Site's repoUrl is then /remotes/<name>.git).
  builder:
    build:
      context: .
      dockerfile: apps/builder/Dockerfile
    container_name: canopy-builder
    restart: unless-stopped
    environment:
      BUILDER_TOKEN: "local-dev-builder-token-not-a-secret-000"
      BUILDER_ALLOW_LOCAL_REPOS: "1"
    volumes:
      - builder_sites:/srv/sites
      - ${HOME}/repos/.canopy-local-remotes:/remotes
    networks:
      - canopy-sites-network

  postgres:
    image: postgres:17-alpine
    container_name: canopy-portal-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: canopy-forms
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - canopy-sites-network

volumes:
  node_modules:
  pgdata:
  builder_sites:

networks:
  canopy-sites-network:
    driver: bridge
