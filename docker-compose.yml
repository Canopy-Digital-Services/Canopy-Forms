name: canopy-sites

services:
  portal:
    build:
      context: .
      dockerfile: apps/portal/Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: "https://forms.canopyds.com"
    container_name: canopy-portal
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:3006:3000"
    networks:
      - canopy-sites-network
      - proxy
    environment:
      # Database - update with your PostgreSQL credentials
      DATABASE_URL: "postgresql://user:password@postgres:5432/canoforms?schema=public"
      
      # NextAuth
      NEXTAUTH_SECRET: "KlIv302grODQdAt/eoJQaE/GtPeBSi7R/2xgYF03SO4="
      NEXTAUTH_URL: "https://forms.canopyds.com"
      NEXT_PUBLIC_APP_URL: "https://forms.canopyds.com"
      AUTH_TRUST_HOST: "true"
      
      # SMTP (Migadu or other)
      SMTP_HOST: "${SMTP_HOST}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER}"
      SMTP_PASS: "${SMTP_PASS}"
      SMTP_FROM: "${SMTP_FROM}"
      
      # Admin seed (optional, for initial setup)
      ADMIN_EMAIL: "admin@canopyds.com"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-changeme123}"
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    container_name: canopy-portal-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: canoforms
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - canopy-sites-network

volumes:
  # Not "postgres_data": see docker-compose.dev.yml.
  pgdata:

networks:
  canopy-sites-network:
    driver: bridge
  proxy:
    external: true